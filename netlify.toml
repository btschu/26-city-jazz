# Netlify reads this file automatically when the site is published.
[build]
  # 1. Find the spreadsheet in data/ (scripts/find-workbook.sh).
  # 2. Write the real title and description into index.html so link previews show them
  #    (scripts/set-page-info.js). Neither step can fail the build.
  command = "sh scripts/find-workbook.sh; node scripts/set-page-info.js || true"
  # Publish the whole folder as-is.
  publish = "."
